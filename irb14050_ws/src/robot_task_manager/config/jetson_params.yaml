robot_task_tree:
  ros__parameters:
    simulation_mode: false
    motion_backend: "abb_moveit"
    tick_hz: 15.0
    use_introspection: false
    default_snapshot_stream: false
    default_snapshot_period: 0.5
    default_snapshot_blackboard_data: false
    default_snapshot_blackboard_activity: false
    robot_ready_default: false
    velocity_scale: 0.12
    planning_time: 4.0
    action_server_timeout_s: 20.0
    xbox_deadman_timeout_s: 0.5
    web_heartbeat_timeout_s: 1.0
    detection_timeout_s: 2.0

egm_joint_jog_servo:
  ros__parameters:
    joint_states_topic: "/joint_states"
    joint_command_topic: "/joint_command"
    twist_topic: "/servo/twist_cmd"
    publish_rate_hz: 50.0
    command_timeout_s: 0.25
    input_deadzone: 0.02
    max_step_deg: 0.35
    joint_names: ["joint_1", "joint_2", "joint_3", "joint_4", "joint_5", "joint_6", "joint_7"]

    # Twist fields are normalized joint-jog channels in the Jetson profile.
    # Defaults cover six axes; joint_7 is left disabled until the real gamepad
    # mapping is confirmed.
    joint_twist_fields:
      ["linear.y", "linear.x", "linear.z", "angular.z", "angular.x", "angular.y", ""]
    joint_velocity_scale_deg_s: [4.0, 4.0, 3.0, 4.0, 3.0, 3.0, 0.0]
    joint_min_deg: [-168.5, -143.5, -168.5, -123.5, -290.0, -88.0, -229.0]
    joint_max_deg: [168.5, 43.5, 168.5, 80.0, 290.0, 138.0, 229.0]

egm_move_joint_action_server:
  ros__parameters:
    action_name: "/arm/move_joint"
    joint_states_topic: "/joint_states"
    joint_command_topic: "/joint_command"
    goal_tolerance_deg: 3.0
    settle_timeout_s: 20.0
    feedback_rate_hz: 10.0
