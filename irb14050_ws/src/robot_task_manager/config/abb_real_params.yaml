robot_task_tree:
  ros__parameters:
    simulation_mode: false
    motion_backend: "abb_moveit"
    robot_ready_default: true
    tick_hz: 20.0
    use_introspection: true
    default_snapshot_stream: true
    default_snapshot_period: 0.1
    default_snapshot_blackboard_data: true
    default_snapshot_blackboard_activity: false

    joint_count: 7
    joint_names: ["joint_1", "joint_2", "joint_3", "joint_4", "joint_5", "joint_6", "joint_7"]
    joint_states_topic: "/joint_states"
    srdf_file: ""
    perception_group_state_name: "vision"

    planning_group: "irb14050_arm"
    base_frame: "base_link"
    ee_frame: "tool0"
    move_group_action_name: "/move_action"
    execute_trajectory_action_name: "/execute_trajectory"
    cartesian_path_service_name: "/compute_cartesian_path"
    planning_time: 5.0
    velocity_scale: 0.15
    pose_position_tolerance_m: 0.01
    pose_orientation_tolerance_rad: 0.1
    cartesian_max_step: 0.005
    cartesian_min_fraction: 0.9
    action_server_timeout_s: 20.0

    gripper_command_topic: "/gripper/command"
    gripper_motion_duration_s: 1.0
    servo_twist_topic: "/servo/twist_cmd"

    # ABB/YuMi single-arm workspace from the existing task2.py envelope.
    workspace_min_x: -0.60
    workspace_max_x: 0.60
    workspace_min_y: -0.60
    workspace_max_y: 0.60
    workspace_min_z: -0.20
    workspace_max_z: 0.80

    pregrasp_offset_z: 0.18
    grasp_offset_z: 0.13
    retreat_offset_z: 0.14
    default_place_x: -0.30
    default_place_y: 0.20
    default_place_z: 0.20

    # Modo de seleccion de dropzone:
    #   "auto"    -> elige por la clase del objeto agarrado (ver *_classes)
    #   "hueco" | "caja" | "default" -> fuerza esa zona (para pruebas)
    place_zone: "auto"
    # En modo "auto": manzana -> hueco, cubo -> caja, lo demas -> default.
    dropzone_hueco_classes: ["apple"]
    dropzone_caja_classes: ["cube"]

    # Dropzones derivadas por cinematica directa desde poses del FlexPendant,
    # expresadas respecto a base_link (posicion de tool0).
    # Dropzone "hueco": J(FlexPendant) = -19.78, -49.42, 31.98, 50.35, 25.67, 102.06, 159.92
    dropzone_hueco_x: -0.24
    dropzone_hueco_y: 0.19
    dropzone_hueco_z: 0.17
    # Dropzone "caja": J(FlexPendant) = 95.51, -105.79, -6.56, 99.37, 96.13, -173.11, 85.52
    dropzone_caja_x: -0.29
    dropzone_caja_y: -0.38
    dropzone_caja_z: 0.20

    use_top_down_grasp_orientation: true
    top_down_qx: 1.0
    top_down_qy: 0.0
    top_down_qz: 0.0
    top_down_qw: 0.0
    tf_timeout_s: 1.0

    web_heartbeat_timeout_s: 1.0
    xbox_deadman_timeout_s: 0.5
    detection_timeout_s: 1.5
    confidence_threshold: 0.5
