home:
  description: "Move robot to home position"
  steps:
    - type: move_joints
      joint_values_deg: [0, 0, 0, 0, 0, 0, 0]

# Pruebas de dropzone: va directo a la pose jogueada en el FlexPendant.
# FlexPendant [J1..J7] -> orden arbol [J1, J2, J7, J3, J4, J5, J6].
dropzone_hueco:
  description: "Ir directo a la dropzone hueco (pose del FlexPendant)"
  steps:
    - type: move_joints
      joint_values_deg: [-19.78, -49.42, 159.92, 31.98, 50.35, 25.67, 102.06]

dropzone_caja:
  description: "Ir directo a la dropzone caja (pose del FlexPendant)"
  steps:
    - type: move_joints
      joint_values_deg: [95.51, -105.79, 85.52, -6.56, 99.37, 96.13, -173.11]

perception2:
  description: "Move to upward perception pose"
  steps:
    - type: move_joints
      joint_values_deg: [8.00, -4.00, 158.00, -24.00, 1, 116, 160]

open_gripper:
  description: "Open gripper"
  steps:
    - type: gripper
      command: open

close_gripper:
  description: "Close gripper"
  steps:
    - type: gripper
      command: close

demo_pick_blue_cube:
  description: "Pick & place del cubo azul con pose hardcodeada (sin vision)"
  # Valores en orden del arbol [joint_1..joint_7] = FlexPendant [J1,J2,J7,J3,J4,J5,J6].
  steps:
    # 1) Pose de vision (overview, por arriba)
    - type: move_joints
      joint_values_deg: [8.00, -4.00, 158.00, -24.00, 1, 116, 160]
    # 2) Abrir gripper antes de aproximar
    - type: gripper
      command: open
    # 3) Aproximacion: arriba del cubo (pre-grasp). FlexPendant:
    #    J1=3.47 J2=-66.62 J3=-24 J4=26.09 J5=57.52 J6=163.61 J7=159.75
    - type: move_joints
      joint_values_deg: [3.47, -66.62, 159.75, -24, 26.09, 57.52, 163.61]
    # 4) Bajar al cubo (agarre = pre-grasp 6cm hacia abajo, joints por IK)
    - type: move_joints
      joint_values_deg: [2.03, -76.8, 161.21, -29.89, 27.68, 52.97, 163.32]
    # 5) Cerrar gripper (recoger)
    - type: gripper
      command: close
    # 6) Lift: subir de nuevo arriba del cubo (mismo pre-grasp del paso 3)
    - type: move_joints
      joint_values_deg: [3.47, -66.62, 159.75, -24, 26.09, 57.52, 163.61]
    - type: move_joints
      joint_values_deg: [51.48, -47.18, 5.95, 48.46, 59.95, 72.15, 130.93]
    # 7) Ir a la caja (dropzone_caja predefinida)
    - type: move_joints
      joint_values_deg: [95.51, -105.79, 85.52, -6.56, 99.37, 96.13, -173.11]
    # 8) Abrir gripper (soltar en la caja)
    - type: gripper
      command: open
# estaban en orden de cable EGM [J1,J2,J3,J4,J5,J6,J7]; aqui se remapearon
# al orden del arbol de comportamiento [joint_1..joint_7] = EGM [J1,J2,J7,J3,J4,J5,J6].
pick_place_completo:
  description: "Complete pick & place: decuoples the disks"
  steps:
    - type: move_joints
      joint_values_deg: [8.00, -4.00, 158.00, -24.00, 1, 116, 160]
    - type: gripper
      command: open
    - type: move_joints
      joint_values_deg: [-11.92, -56.01, -168.39, -11.26, -20.13, 49.00, -84.22]
    - type: gripper
      command: close
    - type: move_joints
      joint_values_deg: [-14.60, -47.10, -164.99, -9.78, -19.53, 55.62, -84.27]
    - type: move_joints
      joint_values_deg: [-54.23, -53.70, -163.97, 26.07, -35.04, 18.09, -104.34]
    - type: gripper
      command: open
    - type: move_joints
      joint_values_deg: [-17.81, -56.74, -163.99, -20.68, -11.80, 63.76, -93.18]
    - type: move_joints
      joint_values_deg: [-13.96, -60.55, -167.99, -14.81, -14.18, 48.58, -87.19]
    - type: gripper
      command: close
    - type: move_joints
      joint_values_deg: [-15.42, -52.72, -165.82, -13.29, -13.97, 55.14, -87.24]
    - type: move_joints
      joint_values_deg: [19.43, -51.30, -166.71, 26.77, -20.30, 22.89, -46.55]
    - type: gripper
      command: open
    - type: move_joints
      joint_values_deg: [-5.75, 6.51, -168.40, 3.06, 0.70, 19.41, -14.13]
    - type: gripper
      command: close
