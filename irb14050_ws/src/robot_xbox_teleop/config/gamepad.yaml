gamepad_command_bridge:
  ros__parameters:
    joy_topic: "/joy"
    command_topic: "/robot_task/command"
    deadman_topic: "/xbox/deadman"
    gripper_command_topic: "/gripper/command"
    source: "gamepad"
    frame_id: "gamepad_command_bridge"
    teleop_command_type: "XBOX_TELEOP"
    priority: 98.0

    # Most Xbox-compatible generic gamepads use LB=4, RB=5.
    deadman_button: 4
    secondary_deadman_button: -1
    deadman_mode: "any"
    require_deadman: true

    # Optional safety/system buttons. Set to your controller button indexes.
    estop_button: -1
    resume_button: -1
    cancel_button: -1

    # Optional gripper buttons. Disabled by default to avoid accidental motion.
    open_gripper_button: -1
    close_gripper_button: -1
    require_deadman_for_gripper: true

    # Common Xbox-style axis layout: left stick XY, right stick X/Z.
    axis_linear_x: 1
    axis_linear_y: 0
    axis_linear_z: 4
    axis_angular_x: -1
    axis_angular_y: -1
    axis_angular_z: 3
    scale_linear_x: 0.20
    scale_linear_y: 0.20
    scale_linear_z: 0.12
    scale_angular_x: 0.0
    scale_angular_y: 0.0
    scale_angular_z: 0.60

    deadzone: 0.08
    rescale_after_deadzone: true
    normalize_linear_xy: true
    publish_rate_hz: 25.0
    joy_timeout_s: 0.6
    publish_zero_on_release: true
    log_mapping_on_start: true
    log_joy_shape_once: true
    log_button_edges: false
