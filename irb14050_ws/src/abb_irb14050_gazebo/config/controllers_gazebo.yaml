# Configuration for gz_ros2_control / controller_manager.
#
# Controller names MUST match what abb_irb14050_moveit_config/config/moveit_controllers.yaml
# expects, otherwise MoveIt's trajectories never reach Gazebo:
#   - "joint_state_broadcaster"  (publishes /joint_states from hw state interfaces)
#   - "irb14050_arm_controller"  (FollowJointTrajectory, 7 arm joints)
#   - "gripper_controller"       (FollowJointTrajectory, 2 gripper joints)

controller_manager:
  ros__parameters:
    update_rate: 100  # Hz — controller_manager loop rate
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    irb14050_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

# -----------------------------------------------------------------------------
# irb14050_arm_controller — follows JointTrajectory actions sent by MoveIt.
# -----------------------------------------------------------------------------
irb14050_arm_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
      - joint_7

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    state_publish_rate: 100.0
    action_monitor_rate: 20.0

    allow_partial_joints_goal: false

    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 0.6
      joint_1: { trajectory: 0.1, goal: 0.05 }
      joint_2: { trajectory: 0.1, goal: 0.05 }
      joint_3: { trajectory: 0.1, goal: 0.05 }
      joint_4: { trajectory: 0.1, goal: 0.05 }
      joint_5: { trajectory: 0.1, goal: 0.05 }
      joint_6: { trajectory: 0.1, goal: 0.05 }
      joint_7: { trajectory: 0.1, goal: 0.05 }

# -----------------------------------------------------------------------------
# gripper_controller — follows JointTrajectory actions for the parallel gripper.
#
# IMPORTANT — tolerance sizing for the gripper:
# The gripper travel is only 0 to 0.025 m (2.5 cm total). In Gazebo, with
# default damping/inertia, the joint lags noticeably from the setpoint during
# the transient. Setting trajectory: 0.0 disables in-flight tolerance checking
# entirely (per ros2_controllers docs), so execution only fails if the gripper
# completely misses the goal — not if it lags during transit. This is the
# sane choice for sim where joint dynamics aren't tuned.
#
# goal: 0.005 (5 mm) is generous but still catches real failures to reach.
# goal_time: 2.0 gives 2 extra seconds to settle after the trajectory ends.
# -----------------------------------------------------------------------------
gripper_controller:
  ros__parameters:
    joints:
      - gripper_joint_l
      - gripper_joint_r

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    state_publish_rate: 100.0
    action_monitor_rate: 20.0

    allow_partial_joints_goal: false

    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 2.0
      gripper_joint_l: { trajectory: 0.0, goal: 0.005 }
      gripper_joint_r: { trajectory: 0.0, goal: 0.005 }
