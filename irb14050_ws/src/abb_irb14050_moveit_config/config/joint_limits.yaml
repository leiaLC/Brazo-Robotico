# joint_limits.yaml
# -----------------
# Restaurado tras regenerar el moveit_config con el gripper.
# El Setup Assistant en Jazzy borra los acceleration limits y mete velocidades
# nativas del URDF (peligrosamente rápidas para el brazo real).
#
# Fixes aplicados:
#   - Brazo: max_velocity bajado a 0.5 rad/s (seguro para hardware real),
#            has_acceleration_limits: true, max_acceleration restaurado
#            (10.0 para joints 1-4, 15.0 para joints 5-7),
#            tolerances de goal restauradas.
#   - Gripper: max_acceleration añadido (1.0 m/s²) — sin esto el
#              JointTrajectoryController puede no completar trayectorias.

joint_limits:
  gripper_joint_l:
    has_velocity_limits: true
    max_velocity: 2.0
    has_acceleration_limits: true
    max_acceleration: 1.0
  gripper_joint_r:
    has_velocity_limits: true
    max_velocity: 2.0
    has_acceleration_limits: true
    max_acceleration: 1.0
  joint_1:
    has_velocity_limits: true
    max_velocity: 0.3
    has_acceleration_limits: true
    max_acceleration: 10.0
    goal_position_tolerance: 0.02
    goal_velocity_tolerance: 0.02
  joint_2:
    has_velocity_limits: true
    max_velocity: 0.3
    has_acceleration_limits: true
    max_acceleration: 10.0
    goal_position_tolerance: 0.02
    goal_velocity_tolerance: 0.02
  joint_3:
    has_velocity_limits: true
    max_velocity: 0.3
    has_acceleration_limits: true
    max_acceleration: 10.0
    goal_position_tolerance: 0.02
    goal_velocity_tolerance: 0.02
  joint_4:
    has_velocity_limits: true
    max_velocity: 0.3
    has_acceleration_limits: true
    max_acceleration: 10.0
    goal_position_tolerance: 0.02
    goal_velocity_tolerance: 0.02
  joint_5:
    has_velocity_limits: true
    max_velocity: 0.3
    has_acceleration_limits: true
    max_acceleration: 15.0
    goal_position_tolerance: 0.02
    goal_velocity_tolerance: 0.02
  joint_6:
    has_position_limits: true
    has_velocity_limits: true
    max_velocity: 0.3
    has_acceleration_limits: true
    max_acceleration: 15.0
  joint_7:
    has_velocity_limits: true
    max_velocity: 0.3
    has_acceleration_limits: true
    max_acceleration: 15.0
    goal_position_tolerance: 0.02
    goal_velocity_tolerance: 0.02
